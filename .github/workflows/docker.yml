name: Docker builder

on:
  push:
    tags: ['*']
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

# a newer push to the same branch/PR makes the running one pointless; tags always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-26.04
    name: Run tests
    timeout-minutes: 30
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # built without NO_DEV, so phpunit and the other dev dependencies are present;
      # plain docker build: no buildx setup, no cache export/import round trip
      - name: Build test image
        run: |
          docker build -f docker/Dockerfile -t platform:test \
            --build-arg COMMIT=${{ github.sha }} .

      # API tests talk to the app over http://127.0.0.1:80 from inside the
      # container, so nginx and php-fpm must be up - start it the regular way
      - name: Start container
        run: |
          docker run -d --name platform-test \
            -e TEST=1 \
            -e DEBUG=1 \
            -e TZ=UTC \
            platform:test

      - name: Wait for web server
        run: |
          for i in $(seq 1 30); do
            if docker exec platform-test curl -fsS -o /dev/null http://127.0.0.1:80/; then
              echo "web server is up"
              exit 0
            fi
            sleep 2
          done
          echo "web server did not start in time"
          docker logs platform-test
          exit 1

      # phinx runs as root and would create the sqlite file as 0644, while
      # php-fpm serves the API tests as www-data - pre-create it writable
      - name: Prepare test database
        run: |
          docker exec platform-test \
            install -m 0666 /dev/null var/database-test.sqlite

      # a fresh image is "not installed": without var/.lock the panel sends
      # every login to the installer (the file is gitignored, so CI never has it)
      - name: Mark the test instance as installed
        run: |
          docker exec platform-test sh -c 'date +%s > var/.lock && chmod 0666 var/.lock'

      # umask 000: the files phpunit makes (as root) must stay writable and
      # deletable for php-fpm (www-data), which handles the panel requests
      - name: Run tests
        run: |
          docker exec -e TEST=1 platform-test sh -c \
            'umask 000 && ./vendor/bin/phpunit --configuration phpunit.xml --colors=never'

      # level 5, known findings are in phpstan-baseline.neon: only new ones fail
      - name: Static analysis
        run: |
          docker exec platform-test \
            ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

      - name: Container logs
        if: failure()
        run: docker logs platform-test

      - name: Stop container
        if: always()
        run: docker rm -f platform-test

  # one image per CPU, built in parallel on a runner of that very CPU: no emulation, so the arm64
  # build is as fast as the amd64 one (and its PHP, JIT included, is compiled for the real machine)
  build:
    name: Build ${{ matrix.platform }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # the default "docker" driver cannot export a build cache, and the
      # cache-to below fails the build outright without this
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # pushed by digest only: the tags are put on both images at once by the next job
      - name: Build and push the image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            NO_DEV=--no-dev
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # a tag that points at both images, so `docker pull` takes the one of the machine it runs on
  manifest:
    name: Publish the multi-arch image
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest and push the tags
        working-directory: /tmp/digests
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker buildx imagetools create \
            -t "${image}:${{ github.ref_name }}" \
            -t "${image}:latest" \
            $(printf "${image}@sha256:%s " *)

      - name: Inspect the result
        run: docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
