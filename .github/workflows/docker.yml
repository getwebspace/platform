name: Docker builder

on:
  push:
    tags: ['*']
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

# a newer push to the same branch/PR makes the running one pointless; tags always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run tests
    timeout-minutes: 30
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # built without NO_DEV, so phpunit and the other dev dependencies are present
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: platform:test
          build-args: |
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # API tests talk to the app over http://127.0.0.1:80 from inside the
      # container, so nginx and php-fpm must be up - start it the regular way
      - name: Start container
        run: |
          docker run -d --name platform-test \
            -e TEST=1 \
            -e DEBUG=1 \
            -e TZ=UTC \
            platform:test

      - name: Wait for web server
        run: |
          for i in $(seq 1 30); do
            if docker exec platform-test curl -fsS -o /dev/null http://127.0.0.1:80/; then
              echo "web server is up"
              exit 0
            fi
            sleep 2
          done
          echo "web server did not start in time"
          docker logs platform-test
          exit 1

      # phinx runs as root and would create the sqlite file as 0644, while
      # php-fpm serves the API tests as www-data - pre-create it writable
      - name: Prepare test database
        run: |
          docker exec platform-test \
            install -m 0666 /dev/null var/database-test.sqlite

      - name: Run tests
        run: |
          docker exec -e TEST=1 platform-test \
            ./vendor/bin/phpunit --configuration phpunit.xml --colors=never

      # level 5, known findings are in phpstan-baseline.neon: only new ones fail
      - name: Static analysis
        run: |
          docker exec platform-test \
            ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

      - name: Container logs
        if: failure()
        run: docker logs platform-test

      - name: Stop container
        if: always()
        run: docker rm -f platform-test

  build:
    runs-on: ubuntu-latest
    name: Build base container
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # the default "docker" driver cannot export a build cache, and the
      # cache-to below fails the build outright without this
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: docker/Dockerfile
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            NO_DEV=--no-dev
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
