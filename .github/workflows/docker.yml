name: Docker builder

on:
  push:
    tags:
      - '*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run tests
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # built without NO_DEV, so phpunit and the other dev dependencies are present
      - name: Build test image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: platform:test
          build-args: |
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # API tests talk to the app over http://127.0.0.1:80 from inside the
      # container, so nginx and php-fpm must be up - start it the regular way
      - name: Start container
        run: |
          docker run -d --name platform-test \
            -e TEST=1 \
            -e DEBUG=1 \
            -e TZ=UTC \
            platform:test

      - name: Wait for web server
        run: |
          for i in $(seq 1 30); do
            if docker exec platform-test curl -fsS -o /dev/null http://127.0.0.1:80/; then
              echo "web server is up"
              exit 0
            fi
            sleep 2
          done
          echo "web server did not start in time"
          docker logs platform-test
          exit 1

      # phinx runs as root and would create the sqlite file as 0644, while
      # php-fpm serves the API tests as www-data - pre-create it writable
      - name: Prepare test database
        run: |
          docker exec platform-test \
            install -m 0666 /dev/null var/database-test.sqlite

      - name: Run tests
        run: |
          docker exec -e TEST=1 platform-test \
            ./vendor/bin/phpunit --configuration phpunit.xml --colors=never

      - name: Container logs
        if: failure()
        run: docker logs platform-test

      - name: Stop container
        if: always()
        run: docker rm -f platform-test

  build:
    runs-on: ubuntu-latest
    name: Build base container
    needs: test
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      # the default "docker" driver cannot export a build cache, and the
      # cache-to below fails the build outright without this
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set tag name environment variable
        id: setup_env
        run: |
          echo "NAME=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT
          echo "BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
          echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          file: docker/Dockerfile
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.setup_env.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            NO_DEV=--no-dev
            NAME=${{ steps.setup_env.outputs.NAME }}
            BRANCH=${{ steps.setup_env.outputs.BRANCH }}
            VERSION=${{ steps.setup_env.outputs.VERSION }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
